<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nuevo Beat | Hidden Room</title>
  <link rel="icon" type="image/webp" href="../../assets/img/orange_logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Space+Grotesk:wght@400;500;600;700&family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css?v=20260901-typography">
  <link rel="stylesheet" href="producer-ready.css?v=20260825-producer-ready">
</head>
<body class="store-page hr-page" data-hr-chrome data-hr-context="store">
  <div id="hr-global-nav"></div>
  <main class="producer-ready-shell"><header class="producer-ready-header"><div><p class="eyebrow hr-eyebrow">Producer Ready</p><h1 id="form-title" class="hr-title-xl">Nuevo Beat</h1><p>Guarda primero un borrador. Publicar siempre requiere revisión.</p></div><a class="secondary-button" href="my-beats.html">Mis Beats</a></header>
    <section class="producer-ready-panel"><form id="beat-form" class="producer-ready-form">
      <div class="producer-ready-form__grid"><label>Título<input name="name" required maxlength="160"></label><label>Slug<input name="slug" required pattern="[a-z0-9-]+" maxlength="160"></label><label>Precio base (MXN)<input name="price" type="number" min="0" step="0.01" required></label><label>Género<input name="genre" maxlength="80"></label><label>BPM<input name="bpm" type="number" min="1" max="300"></label><label>Tonalidad<input name="key" maxlength="24"></label></div>
      <label>Descripción<textarea name="description" rows="4" maxlength="3000"></textarea></label>
      <div class="producer-ready-form__grid"><label>Portada<input name="cover" type="file" accept="image/*,.jpg,.jpeg,.png,.webp"><small id="cover-state">Sin portada nueva seleccionada.</small></label><label>Master / WAV<input name="audio" type="file" accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg,.flac,.aif,.aiff"><small id="audio-state">Sin master nuevo seleccionado.</small></label><label>Stems (opcional)<input name="stems" type="file" multiple accept="audio/*,.zip"><small>Se registran como archivos protegidos cuando el almacenamiento esté conectado.</small></label></div>
      <fieldset><legend>Licencias y precios</legend><div id="license-list"><p>Cargando licencias...</p></div></fieldset>
      <p id="form-error" class="producer-ready-error" role="alert"></p><p id="form-status" class="producer-ready-status" role="status" aria-live="polite"></p>
      <div class="producer-ready-actions"><button class="primary-button" type="submit">Guardar borrador</button><button id="submit-review" class="secondary-button" type="button" disabled>Guardar y enviar a revisión</button></div>
    </form></section>
  </main>
  <script src="../../site.js?v=20260825-producer-ready"></script><script type="module" src="new-beat.js?v=20260825-producer-ready"></script>
</body>
</html>
